workflow:
  id: job_apply
  app: "Job Apply"
  name: "Apply to a job"
  version: 1
  site_terms: { reviewed: 2026-11-07, basis: "Greenhouse, Lever: no candidate terms; employer's notice governs; admin submits. Himalayas cl. 30A" }

  browser:
    application: chrome
    profile_directory: "Profile 2"     # same Chrome profile for both flows
    account: rupak.kumar.ambasta02@gmail.com   # verified on google.com before any site

  inputs:
    job_url: { label: "Himalayas job link", pattern: "https://himalayas\\.app/companies/[a-z0-9-]+/jobs/[a-z0-9-]+" }

  permissions:                          # Rule 9: unlisted = denied
    allow: [launch_application, navigate, read_page, click, fill_field, ask_admin, attach_file]
    max_element_risk: modify            # Submit / Autofill / Apply with LinkedIn are submit: the admin submits
  destinations: ["https://www.google.com", "https://himalayas.app", "https://job-boards.greenhouse.io", "https://jobs.lever.co"]

  steps:
    - { id: launch_chrome, action: launch_application }
    - { id: open_google, action: navigate, value: "https://www.google.com" }
    - { id: on_google, action: classify_page, on_match: { google_home: continue, unknown: stop_and_report } }
    - { id: verify_account, action: verify_account, target: google_home.account_button }
    - { id: open_job, action: navigate, value_from: input.job_url }
    - id: authentication_guard
      action: classify_page
      on_match:
        himalayas_job_apply: continue
        himalayas_logged_out: stop_and_request_user
        himalayas_job_logged_out: stop_and_request_user
        unknown: stop_and_report
    - { id: apply, action: click, target: himalayas_job_apply.apply_button }
    - id: on_form
      action: classify_page
      on_match:
        himalayas_apply_prompt: { click: ready }   # the "I'm ready to apply" popup, when it shows
        greenhouse_application: continue
        lever_application: continue
        unknown: stop_and_report
    - { id: fill, action: fill_form }
    - { id: attach_cv, action: attach_file, target: current_page.resume_attach, check: current_page.resume_input }
    # no close_window: the admin reviews and submits in this window

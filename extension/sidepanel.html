<!doctype html>
<meta charset="utf-8">
<title>GOV-AIOS Teach</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 12px; color: #222; }
  button, input { font: inherit; margin: 0 4px 6px 0; padding: 4px 10px; }
  #note { color: #a00; min-height: 1.4em; }
  nav button[aria-pressed="true"] { font-weight: bold; }
  pre, ol { background: #f5f5f5; padding: 8px; overflow: auto; white-space: pre-wrap; }
  [hidden] { display: none; }
</style>
<h3>GOV-AIOS Teach</h3>
<div id="note" role="status"></div>
<section id="pair" hidden>
  <input id="code" inputmode="numeric" maxlength="6" size="8" placeholder="6-digit code" aria-label="Pairing code">
  <button id="connect">Connect</button>
</section>
<section id="main" hidden>
  <div id="controls">
    <button id="teach">Teach</button>
    <button id="pause">Pause</button>
    <button id="resume">Resume</button>
    <button id="done">Done</button>
    <button id="cancel">Cancel</button>
    <button id="discard">Discard</button>
  </div>
  <div id="ask" hidden>
    <input id="appname" maxlength="60" placeholder="Name of the app" aria-label="App name">
    <button id="make">Make app</button>
  </div>
  <nav><button id="t-steps" aria-pressed="true">Steps</button><button id="t-yaml" aria-pressed="false">YAML</button></nav>
  <ol id="steps"></ol>
  <pre id="yaml" hidden></pre>
</section>
<script src="sidepanel.js"></script>
